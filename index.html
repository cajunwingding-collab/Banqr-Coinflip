<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coin Flip</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at center, #292929 0%, #111 45%, #050505 100%);

      color: white;
      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(circle, rgba(255, 215, 80, 0.08) 0%, transparent 55%);

      pointer-events: none;
    }

    .container {
      text-align: center;
      z-index: 1;
    }

    .title {
      font-size: 18px;
      letter-spacing: 7px;
      text-transform: uppercase;

      color: #d6b85a;

      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 55px;

      font-size: 58px;
      font-weight: 800;
      letter-spacing: 2px;

      text-shadow:
        0 0 15px rgba(255, 215, 80, 0.15);
    }

    .coin-area {
      perspective: 1200px;

      width: 260px;
      height: 260px;

      margin: 0 auto 55px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .coin {
      width: 220px;
      height: 220px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;

      background:
        radial-gradient(circle at 35% 30%,
          #fff4a8 0%,
          #f7d85c 18%,
          #d4a928 55%,
          #9a6b0d 100%);

      border: 9px solid #e0b936;

      box-shadow:
        0 0 0 4px #6e4d0a,
        0 10px 35px rgba(0, 0, 0, 0.7),
        0 0 45px rgba(255, 204, 50, 0.2);

      transform-style: preserve-3d;

      user-select: none;

      font-size: 30px;
      font-weight: 900;

      color: #5b4107;

      text-shadow:
        1px 1px 0 #ffe98a;
    }

    .coin::before {
      content: "";
      position: absolute;
      inset: 13px;

      border-radius: 50%;

      border: 3px solid rgba(91, 65, 7, 0.35);

      pointer-events: none;
    }

    .coin::after {
      content: "";
      position: absolute;
      inset: 23px;

      border-radius: 50%;

      border: 2px dashed rgba(91, 65, 7, 0.25);

      pointer-events: none;
    }

    .flipping {
      animation: dramaticFlip 2s cubic-bezier(0.15, 0.8, 0.25, 1);
    }

    @keyframes dramaticFlip {
      0% {
        transform: rotateY(0deg) scale(1);
      }

      20% {
        transform: rotateY(500deg) scale(1.08);
      }

      55% {
        transform: rotateY(1200deg) scale(1.12);
      }

      80% {
        transform: rotateY(1650deg) scale(1.06);
      }

      100% {
        transform: rotateY(1800deg) scale(1);
      }
    }

    .shadow {
      width: 150px;
      height: 25px;

      margin: -35px auto 35px;

      background: rgba(0, 0, 0, 0.5);

      border-radius: 50%;

      filter: blur(10px);
    }

    .result {
      min-height: 34px;

      font-size: 25px;
      font-weight: 700;

      letter-spacing: 4px;

      color: #f5d76e;

      text-shadow:
        0 0 15px rgba(245, 215, 110, 0.4);
    }

    .hint {
      margin-top: 20px;

      font-size: 13px;
      letter-spacing: 3px;

      color: #777;

      text-transform: uppercase;
    }

    .flip-button {
      margin-top: 30px;

      padding: 17px 55px;

      border: 1px solid #d5ae3b;
      border-radius: 50px;

      background:
        linear-gradient(180deg, #e6c34d, #a87b16);

      color: #241900;

      font-size: 18px;
      font-weight: 900;

      letter-spacing: 3px;

      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(230, 195, 77, 0.15);

      transition:
        transform 0.15s,
        box-shadow 0.15s;
    }

    .flip-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(230, 195, 77, 0.3);
    }

    .flip-button:active {
      transform: translateY(2px);
    }

    .disabled {
      pointer-events: none;
      opacity: 0.6;
    }

  </style>

</head>

<body>

  <div class="container">

```
<div class="title">
  The Ultimate
</div>

<h1>COIN FLIP</h1>

<div class="coin-area">

  <div class="coin" id="coin">
    ?
  </div>

</div>

<div class="shadow"></div>

<div class="result" id="result">
  READY?
</div>

<button class="flip-button" id="flipButton">
  FLIP
</button>

<div class="hint">
  Press Space to flip
</div>
```

  </div>

  <script>

    let aHeld = false;
    let dHeld = false;
    let flipping = false;

    const coin = document.getElementById("coin");
    const result = document.getElementById("result");
    const button = document.getElementById("flipButton");


    document.addEventListener("keydown", function(event) {

      const key = event.key.toLowerCase();

      if (key === "a") {
        aHeld = true;
      }

      if (key === "d") {
        dHeld = true;
      }

      if (event.code === "Space") {

        event.preventDefault();

        flipCoin();

      }

    });


    document.addEventListener("keyup", function(event) {

      const key = event.key.toLowerCase();

      if (key === "a") {
        aHeld = false;
      }

      if (key === "d") {
        dHeld = false;
      }

    });


    button.addEventListener("click", flipCoin);


    function flipCoin() {

      if (flipping) return;

      flipping = true;

      button.classList.add("disabled");

      result.textContent = "FLIPPING...";

      coin.textContent = "?";


      let outcome;


      if (aHeld && !dHeld) {

        outcome = "HEADS";

      }

      else if (dHeld && !aHeld) {

        outcome = "TAILS";

      }

      else {

        outcome = Math.random() < 0.5
          ? "HEADS"
          : "TAILS";

      }


      coin.classList.remove("flipping");

      void coin.offsetWidth;

      coin.classList.add("flipping");


      setTimeout(function() {

        coin.textContent = outcome;

        result.textContent = outcome;

        flipping = false;

        button.classList.remove("disabled");

      }, 2000);

    }

  </script>

</body>
</html>
